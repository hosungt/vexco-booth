<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  graph-match.html — 식↔그래프 쉘 (schemaVersion 1, template "graph")
  이 파일은 quiz.html(공통 계약의 원본)의 공통 블록을 그대로 복제한 콘텐츠 쉘 중 하나다.
  아래 "공통 계약" 표시가 붙은 JS/CSS 블록은 quiz.html과 동일하다(template 판정 문자열만 예외).

  사용법: 이 파일을 복사한 뒤 아래 id="config" 스크립트 블록(JSON) 내용만 교체한다.
  엔진(CSS/JS)은 건드리지 않는다.

  ★ 선생님은 SVG를 직접 쓰지 않는다. CONFIG에는 "함수의 계수"만 적고,
    좌표평면(격자·축·원점)과 곡선은 엔진이 그린다.

  함수 객체(아래 세 가지 중 하나, 모든 계수는 숫자여야 한다):
  { "type": "linear",    "a": 2, "b": -1 }            // y = ax + b
  { "type": "quadratic", "a": 1, "p": 0, "q": -2 }    // y = a(x - p)² + q  (꼭짓점 (p, q), a ≠ 0)
  { "type": "inverse",   "k": 6 }                     // y = k / x          (반비례, k ≠ 0)

  CONFIG 스키마:
  {
    "schemaVersion": 1,              // 고정값, 반드시 1
    "template": "graph",             // 고정값, 반드시 "graph"
    "title": "문자열",                 // 필수, 화면 상단 제목
    "subtitle": "문자열",              // 선택, 제목 아래 부제
    "theme": "indigo|pink|green|violet|teal|amber",  // 필수, 6종 중 하나
    "credit": {                      // 필수
      "mode": "anonymous|named",     // anonymous: 무기명 / named: 이름·학교 표기
      "name": "문자열",                // mode가 named일 때만 사용
      "school": "문자열"               // mode가 named일 때만 사용
    },
    "questions": [                   // 필수, 1개 이상. 배열 순서대로 푼다(문항 셔플 없음).
      // (1) 식 → 그래프 고르기
      {
        "mode": "toGraph",                              // 고정값
        "prompt": "문자열",                               // 필수, 빈 문자열 불가
        "answer": { 함수 객체 },                          // 필수, 정답 그래프
        "distractors": [ { 함수 객체 }, ... ],            // 필수, 2~3개(→ 보기 3~4개)
        "explanation": "문자열"                           // 선택, 오답 시·결과 화면에 표시
      },
      // (2) 그래프 → 식 고르기
      {
        "mode": "toEquation",                           // 고정값
        "prompt": "문자열",                               // 필수, 빈 문자열 불가
        "graph": { 함수 객체 },                           // 필수, 크게 보여줄 그래프
        "choices": ["문자열", "..."],                     // 필수, 2개 이상(4개 권장). 빈 문자열 불가.
        "answerIndex": 0,                               // 필수, choices 인덱스(정수, 범위 내)
        "explanation": "문자열"                           // 선택
      }
    ]
  }

  제약 요약: mode는 toGraph/toEquation 중 하나 · prompt는 비어있지 않은 문자열 ·
  toGraph의 distractors는 2~3개 · toEquation의 choices는 2개 이상 문자열이고
  answerIndex는 0 이상 choices.length 미만의 정수 · 함수 객체의 계수는 모두 숫자이며
  inverse는 k ≠ 0, quadratic은 a ≠ 0. 위반 시 화면 전체가 "CONFIG 오류: ..." 카드로 바뀐다.

  이스케이프 규칙: 위 script#config 블록은 <script> 태그이므로, 브라우저 HTML 파서는
  이 블록 안에서도 "</script" 로 시작하는 문자열을 만나면 태그를 즉시 조기 종료시킨다.
  따라서 CONFIG의 어떤 문자열 값에 "</" 시퀀스가 들어가면 반드시 "<\/" 로 이스케이프해서
  적는다. 예: prompt에 "a</b>" 를 쓰고 싶다면 "a<\/b>" 로 적을 것.
  (아래 예시의 <sup>2</sup> 처럼 "sup"·"sub" 태그는 "script"로 시작하지 않아 안전하지만,
  안전을 위해 CONFIG를 새로 작성할 때는 "</" 가 보이면 습관적으로 "<\/" 로 바꿔 적는다.)

  렌더링 규칙: 모든 CONFIG 문자열(prompt·choices·explanation 등)은 renderText()로 escape 후
  &lt;sup&gt;/&lt;sub&gt; 태그만 화이트리스트로 되돌려 <sup>/<sub>(제곱·아래첨자 표기)만 허용한다.

  그래프 렌더링 규칙: viewBox 200×200 고정, x·y 범위는 −5 ~ 5(1칸 = 20px).
  곡선은 x를 201개로 샘플링한 polyline이며 뷰박스 밖은 clipPath로 잘라낸다.
  정의되지 않는 곳(반비례의 x = 0)과 |y|가 20을 넘는 구간에서 갈래가 끊기므로
  반비례는 항상 두 갈래로 그려진다. 곡선 색은 테마 변수 var(--primary)를 쓴다.
  같은 SVG 마크업을 작은 카드(2×2로 4개)와 큰 그래프(1개) 두 곳에 쓰고, 크기 차이는
  CSS(.graph-card / .graph-big)로만 준다. 눈금 숫자는 작은 카드에서 CSS로 숨긴다.

  조작 방식: 한 문항씩 풀고 [다음 문제]로 넘어간다. 정오는 색과 아이콘(○/×)을 함께 쓴다.
  toGraph는 정답 1개와 distractors를 섞어 보여주며, 선택 직후 정답 카드에 ○,
  틀리게 고른 카드에 ×를 표시한다. 마지막에 점수 · 틀린 문제 다시보기 · [다시 도전] 화면.
-->
<title>식과 그래프</title>
<style>
  /* ===== 공통 계약: 기본 리셋 · 폰트 · 레이아웃 (모든 쉘 동일) ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f8fafc;
    color: #1f2937;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ===== 공통 계약: 테마 프리셋 CSS 변수 6종 (모든 쉘 동일) ===== */
  body.theme-indigo { --primary:#4f46e5; --primary-light:#eef2ff; --primary-dark:#4338ca; }
  body.theme-pink   { --primary:#db2777; --primary-light:#fdf2f8; --primary-dark:#be185d; }
  body.theme-green  { --primary:#16a34a; --primary-light:#f0fdf4; --primary-dark:#15803d; }
  body.theme-violet { --primary:#7c3aed; --primary-light:#f5f3ff; --primary-dark:#6d28d9; }
  body.theme-teal   { --primary:#0d9488; --primary-light:#f0fdfa; --primary-dark:#0f766e; }
  body.theme-amber  { --primary:#d97706; --primary-light:#fffbeb; --primary-dark:#b45309; }

  /* ===== 공통 계약: 에러 카드 (showError가 사용, 모든 쉘 동일) ===== */
  .error-card {
    max-width: 480px;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .error-icon { font-size: 32px; margin-bottom: 12px; }
  .error-msg { color: #374151; font-size: 15px; white-space: pre-wrap; word-break: break-word; margin: 0; }

  /* ===== 공통 계약: credit 푸터 (모든 쉘 동일) ===== */
  .credit { text-align: center; font-size: 12px; color: #6b7280; margin-top: 24px; }

  /* ===== graph 전용 스타일 ===== */
  .app-header { text-align: center; margin-bottom: 16px; }
  .app-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; word-break: keep-all; }
  .app-subtitle { font-size: 14px; color: #6b7280; margin: 0; word-break: keep-all; }

  .progress-wrap { margin-bottom: 16px; }
  .progress-bar { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--primary); height: 100%; transition: width .25s ease; }
  .progress-label { text-align: right; font-size: 12px; color: #6b7280; margin-top: 4px; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    margin-bottom: 16px;
  }
  .prompt { font-size: 17px; font-weight: 600; margin: 0 0 16px; word-break: keep-all; overflow-wrap: break-word; }

  /* --- 그래프 SVG 공통(크기는 컨테이너가 정한다) --- */
  .graph-svg { display: block; width: 100%; height: auto; }
  .g-grid { stroke: #e5e7eb; stroke-width: 1; }
  .g-axis { stroke: #9ca3af; stroke-width: 1.5; }
  .g-origin { fill: #9ca3af; }
  .g-tick { fill: #9ca3af; font-size: 11px; font-family: inherit; }
  .g-curve { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }

  /* --- toGraph: 작은 그래프 4개(2×2) --- */
  .graph-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .graph-card {
    position: relative; display: block; width: 100%;
    padding: 8px; border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; cursor: pointer; font-family: inherit;
  }
  .graph-card:not(:disabled):hover { border-color: var(--primary); }
  .graph-card:not(:disabled):active { background: var(--primary-light); }
  .graph-card.correct { border-color: #16a34a; background: #f0fdf4; }
  .graph-card.wrong { border-color: #dc2626; background: #fef2f2; }
  .graph-card.disabled { opacity: .5; }
  .graph-card:disabled { cursor: default; }
  .graph-card .g-tick { display: none; }   /* 작은 카드에서는 눈금 숫자 생략 */
  .graph-mark {
    position: absolute; top: 6px; left: 6px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #f3f4f6; color: #6b7280;
    font-size: 14px; font-weight: 700; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .graph-card.correct .graph-mark { background: #dcfce7; color: #16a34a; }
  .graph-card.wrong .graph-mark { background: #fee2e2; color: #dc2626; }

  /* --- toEquation: 큰 그래프 1개 --- */
  .graph-big { max-width: 260px; margin: 0 auto 16px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; min-height: 48px; padding: 12px 16px;
    border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; color: #1f2937;
    font-size: 15px; text-align: left; cursor: pointer;
    font-family: inherit;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .choice-btn:not(:disabled):hover { border-color: var(--primary); }
  .choice-btn:not(:disabled):active { background: var(--primary-light); }
  .choice-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #16a34a; font-weight: 700; }
  .choice-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; font-weight: 700; }
  .choice-btn.disabled { opacity: .5; }
  .choice-btn:disabled { cursor: default; }
  .ans-icon { font-weight: 700; }
  .choice-text { flex: 1; min-width: 0; }

  .btn-primary {
    display: block; width: 100%; min-height: 48px;
    background: var(--primary); color: #ffffff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    padding: 12px 16px;
  }
  .btn-primary:hover { background: var(--primary-dark); }

  .feedback { display: flex; gap: 10px; margin-top: 16px; padding: 14px; border-radius: 12px; align-items: flex-start; }
  .feedback.correct { background: #f0fdf4; }
  .feedback.wrong { background: #fef2f2; }
  .fb-icon { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .fb-body { flex: 1; min-width: 0; }
  .feedback.correct .fb-icon { color: #16a34a; }
  .feedback.wrong .fb-icon { color: #dc2626; }
  .fb-head { margin: 0 0 4px; font-weight: 700; }
  .feedback.correct .fb-head { color: #16a34a; }
  .feedback.wrong .fb-head { color: #dc2626; }
  .fb-detail { margin: 4px 0 0; font-size: 14px; color: #1f2937; word-break: keep-all; overflow-wrap: break-word; }

  .result-card { text-align: center; }
  .result-score { font-size: 36px; font-weight: 800; color: var(--primary); }
  .result-sub { color: #6b7280; margin-top: 6px; }

  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .review-item { display: flex; gap: 10px; background: #ffffff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .review-num {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: #fef2f2; color: #dc2626; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .review-body { flex: 1; min-width: 0; }
  .review-prompt { margin: 0 0 4px; font-weight: 600; word-break: keep-all; overflow-wrap: break-word; }
  .review-explain { margin: 0; font-size: 14px; color: #6b7280; word-break: keep-all; overflow-wrap: break-word; }

  .btn-retry { margin-bottom: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="config">
{
  "schemaVersion": 1,
  "template": "graph",
  "title": "식과 그래프, 연결하기",
  "subtitle": "식을 보고 그래프를, 그래프를 보고 식을 골라 보세요",
  "theme": "teal",
  "credit": { "mode": "anonymous", "name": "", "school": "" },
  "questions": [
    {
      "mode": "toGraph",
      "prompt": "y = 2x - 1 의 그래프는 어느 것일까요?",
      "answer": { "type": "linear", "a": 2, "b": -1 },
      "distractors": [
        { "type": "linear", "a": -2, "b": -1 },
        { "type": "linear", "a": 2, "b": 1 },
        { "type": "linear", "a": 0.5, "b": -1 }
      ],
      "explanation": "기울기 2는 양수라 오른쪽 위로 향하고, x가 1 늘 때 y가 2 늘어납니다. y절편이 -1이므로 y축과 (0, -1)에서 만납니다."
    },
    {
      "mode": "toGraph",
      "prompt": "y = (x - 2)<sup>2<\/sup> - 3 의 그래프는 어느 것일까요?",
      "answer": { "type": "quadratic", "a": 1, "p": 2, "q": -3 },
      "distractors": [
        { "type": "quadratic", "a": 1, "p": -2, "q": -3 },
        { "type": "quadratic", "a": -1, "p": 2, "q": -3 },
        { "type": "quadratic", "a": 1, "p": 2, "q": 3 }
      ],
      "explanation": "y = a(x - p)<sup>2<\/sup> + q 의 꼭짓점은 (p, q)입니다. (x - 2)<sup>2<\/sup>이므로 p = 2(오른쪽으로 2칸), q = -3이라 꼭짓점은 (2, -3), a = 1 > 0이라 아래로 볼록합니다."
    },
    {
      "mode": "toEquation",
      "prompt": "이 그래프의 식은 무엇일까요?",
      "graph": { "type": "linear", "a": -1, "b": 2 },
      "choices": ["y = -x + 2", "y = x + 2", "y = -x - 2", "y = 2x + 1"],
      "answerIndex": 0,
      "explanation": "오른쪽 아래로 향하니 기울기가 음수(-1)이고, y축과 (0, 2)에서 만나므로 y = -x + 2입니다."
    },
    {
      "mode": "toEquation",
      "prompt": "이 그래프의 식은 무엇일까요?",
      "graph": { "type": "inverse", "k": 6 },
      "choices": ["y = 6x", "y = 6/x", "y = -6/x", "y = x + 6"],
      "answerIndex": 1,
      "explanation": "두 갈래가 제1사분면과 제3사분면에 있는 반비례 그래프입니다. (2, 3)을 지나므로 xy = 6, 즉 y = 6/x 입니다."
    }
  ]
}
</script>

<script>
(function () {
  "use strict";

  /* ===== 공통 계약 (모든 쉘 동일) — quiz.html의 블록을 그대로 복제한다 ===== */

  function getConfig() {
    var parsed;
    try {
      parsed = JSON.parse(document.getElementById('config').textContent);
    } catch (e) {
      showError('CONFIG 오류: JSON 문법 — ' + e.message);
      return null;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      showError('CONFIG 오류: CONFIG는 JSON 객체({ ... })여야 합니다. 현재 값의 타입을 확인해 주세요.');
      return null;
    }
    return parsed;
  }

  function showError(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="error-card"><div class="error-icon">⚠️</div><p class="error-msg"></p></div>';
    app.querySelector('.error-msg').textContent = msg;
  }

  function validateCommon(cfg) {
    if (cfg.schemaVersion !== 1) {
      showError('CONFIG 오류: schemaVersion이 1이 아닙니다.');
      return false;
    }
    if (cfg.template !== 'graph') {
      showError('CONFIG 오류: template이 "graph"가 아닙니다.');
      return false;
    }
    if (typeof cfg.title !== 'string' || cfg.title.length === 0) {
      showError('CONFIG 오류: title이 없거나 빈 문자열입니다.');
      return false;
    }
    if (['indigo', 'pink', 'green', 'violet', 'teal', 'amber'].indexOf(cfg.theme) === -1) {
      showError('CONFIG 오류: theme 값이 올바르지 않습니다. (indigo/pink/green/violet/teal/amber 중 하나)');
      return false;
    }
    if (!cfg.credit || ['anonymous', 'named'].indexOf(cfg.credit.mode) === -1) {
      showError('CONFIG 오류: credit.mode 값이 올바르지 않습니다. (anonymous/named 중 하나)');
      return false;
    }
    return true;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(s) {
    return escapeHtml(s)
      .replace(/&lt;sup&gt;/g, '<sup>')
      .replace(/&lt;\/sup&gt;/g, '</sup>')
      .replace(/&lt;sub&gt;/g, '<sub>')
      .replace(/&lt;\/sub&gt;/g, '</sub>');
  }

  function applyTheme(cfg) {
    document.body.classList.add('theme-' + cfg.theme);
  }

  function creditFooterHtml(cfg) {
    var c = cfg.credit;
    var text;
    if (c.mode === 'anonymous') {
      text = '2026 과학·수학·정보 교사 컨퍼런스에서 제작';
    } else {
      text = renderText(c.name || '') + ' 선생님 (' + renderText(c.school || '') + ') · 2026 과학·수학·정보 교사 컨퍼런스';
    }
    return '<footer class="credit">' + text + '</footer>';
  }

  function headerHtml(cfg) {
    var sub = cfg.subtitle ? '<p class="app-subtitle">' + renderText(cfg.subtitle) + '</p>' : '';
    return '<header class="app-header"><h1 class="app-title">' + renderText(cfg.title) + '</h1>' + sub + '</header>';
  }

  /* ===== 공통 계약 끝 ===== */

  /* ===== graph 전용: 함수 검증 헬퍼 ===== */

  function isNum(v) {
    return typeof v === 'number' && isFinite(v);
  }

  function shownValue(v) {
    return typeof v === 'string' ? '"' + v + '"' : String(v);
  }

  // 문제가 없으면 null, 있으면 무엇이 잘못됐는지 설명하는 문자열을 돌려준다.
  // 두 함수가 같은 그래프인지 비교하기 위한 키(검증에서만 쓴다 — fnProblem 통과 후 호출).
  function fnKey(fn) {
    if (fn.type === 'linear') return 'linear:' + fn.a + ':' + fn.b;
    if (fn.type === 'quadratic') return 'quadratic:' + fn.a + ':' + fn.p + ':' + fn.q;
    return 'inverse:' + fn.k;
  }

  function fnProblem(fn) {
    if (!fn || typeof fn !== 'object' || Array.isArray(fn)) {
      return '함수 객체(예: { "type": "linear", "a": 2, "b": -1 })가 아닙니다';
    }
    if (['linear', 'quadratic', 'inverse'].indexOf(fn.type) === -1) {
      return 'type이 linear/quadratic/inverse 중 하나가 아닙니다 (현재 값: ' + shownValue(fn.type) + ')';
    }
    if (fn.type === 'linear') {
      if (!isNum(fn.a)) return 'linear(y = ax + b)의 계수 a가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.a) + ')';
      if (!isNum(fn.b)) return 'linear(y = ax + b)의 계수 b가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.b) + ')';
      return null;
    }
    if (fn.type === 'quadratic') {
      if (!isNum(fn.a)) return 'quadratic(y = a(x - p)² + q)의 계수 a가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.a) + ')';
      if (!isNum(fn.p)) return 'quadratic(y = a(x - p)² + q)의 계수 p가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.p) + ')';
      if (!isNum(fn.q)) return 'quadratic(y = a(x - p)² + q)의 계수 q가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.q) + ')';
      if (fn.a === 0) return 'quadratic의 a는 0이 될 수 없습니다 (a = 0이면 포물선이 아닙니다)';
      return null;
    }
    if (!isNum(fn.k)) return 'inverse(y = k / x)의 계수 k가 숫자가 아닙니다 (현재 값: ' + shownValue(fn.k) + ')';
    if (fn.k === 0) return 'inverse의 k는 0이 될 수 없습니다 (k = 0이면 반비례가 아닙니다)';
    return null;
  }

  /* ===== graph 전용: 검증 ===== */

  function validateGraph(cfg) {
    if (!Array.isArray(cfg.questions) || cfg.questions.length === 0) {
      showError('CONFIG 오류: questions 배열이 비어있습니다.');
      return false;
    }
    for (var i = 0; i < cfg.questions.length; i++) {
      var q = cfg.questions[i];
      var n = i + 1;
      if (!q || typeof q !== 'object' || Array.isArray(q) || ['toGraph', 'toEquation'].indexOf(q.mode) === -1) {
        showError('CONFIG 오류: ' + n + '번 문항의 mode가 올바르지 않습니다. (toGraph/toEquation 중 하나)');
        return false;
      }
      if (typeof q.prompt !== 'string' || q.prompt.length === 0) {
        showError('CONFIG 오류: ' + n + '번 문항의 prompt가 없거나 빈 문자열입니다.');
        return false;
      }
      if (q.mode === 'toGraph') {
        var ansProblem = fnProblem(q.answer);
        if (ansProblem) {
          showError('CONFIG 오류: ' + n + '번 문항의 answer가 올바르지 않습니다 — ' + ansProblem + '.');
          return false;
        }
        if (!Array.isArray(q.distractors) || q.distractors.length < 2 || q.distractors.length > 3) {
          showError('CONFIG 오류: ' + n + '번 문항의 distractors는 함수 객체 2~3개의 배열이어야 합니다. (현재: ' +
            (Array.isArray(q.distractors) ? q.distractors.length + '개' : '배열이 아님') + ')');
          return false;
        }
        // 같은 그래프가 두 번 나오면 정답이 둘이 되어 채점이 어긋난다.
        var seenFns = [fnKey(q.answer)];
        for (var j = 0; j < q.distractors.length; j++) {
          var dProblem = fnProblem(q.distractors[j]);
          if (dProblem) {
            showError('CONFIG 오류: ' + n + '번 문항의 distractors ' + (j + 1) + '번째가 올바르지 않습니다 — ' + dProblem + '.');
            return false;
          }
          var dKey = fnKey(q.distractors[j]);
          if (seenFns.indexOf(dKey) !== -1) {
            showError('CONFIG 오류: ' + n + '번 문항의 distractors ' + (j + 1) + '번째가 answer 또는 다른 보기와 같은 그래프입니다. 계수를 다르게 하세요.');
            return false;
          }
          seenFns.push(dKey);
        }
      } else {
        var graphProblem = fnProblem(q.graph);
        if (graphProblem) {
          showError('CONFIG 오류: ' + n + '번 문항의 graph가 올바르지 않습니다 — ' + graphProblem + '.');
          return false;
        }
        if (!Array.isArray(q.choices) || q.choices.length < 2) {
          showError('CONFIG 오류: ' + n + '번 문항의 choices는 2개 이상의 배열이어야 합니다.');
          return false;
        }
        for (var c = 0; c < q.choices.length; c++) {
          if (typeof q.choices[c] !== 'string' || q.choices[c].length === 0) {
            showError('CONFIG 오류: ' + n + '번 문항의 choices ' + (c + 1) + '번째가 문자열이 아니거나 빈 문자열입니다.');
            return false;
          }
        }
        if (!Number.isInteger(q.answerIndex) || q.answerIndex < 0 || q.answerIndex >= q.choices.length) {
          showError('CONFIG 오류: ' + n + '번 문항의 answerIndex가 choices 범위를 벗어났습니다. (0 ~ ' + (q.choices.length - 1) + ' 사이의 정수)');
          return false;
        }
      }
    }
    return true;
  }

  /* ===== graph 전용: 좌표계 · 그래프 렌더러 ===== */

  var VIEW = 200;                  // viewBox 한 변(px)
  var AXIS_MAX = 5;                // x·y 표시 범위 −5 ~ 5
  var UNIT = VIEW / (AXIS_MAX * 2);// 1단위 = 20px
  var Y_LIMIT = 20;                // |y|가 이 값을 넘으면 표본에서 제외(뷰박스 밖) → 갈래가 끊긴다
  var SAMPLES = 200;               // x 구간 분할 수 → 표본점 201개

  function sx(x) { return VIEW / 2 + x * UNIT; }   // 수학 x → 픽셀 x
  function sy(y) { return VIEW / 2 - y * UNIT; }   // 수학 y → 픽셀 y(아래로 증가하므로 부호 반전)

  function fnValue(fn, x) {
    if (fn.type === 'linear') return fn.a * x + fn.b;
    if (fn.type === 'quadratic') return fn.a * (x - fn.p) * (x - fn.p) + fn.q;
    if (Math.abs(x) < 1e-9) return null;           // inverse: x = 0에서 정의되지 않음
    return fn.k / x;
  }

  // 곡선을 "끊기지 않는 갈래"들의 배열로 만든다.
  // 값이 없거나 |y| > Y_LIMIT인 지점에서 갈래가 끊기므로 반비례는 x<0, x>0 두 갈래가 된다.
  function buildSegments(fn) {
    var segs = [];
    var cur = [];
    for (var i = 0; i <= SAMPLES; i++) {
      var x = -AXIS_MAX + (2 * AXIS_MAX) * i / SAMPLES;
      var y = fnValue(fn, x);
      if (y === null || !isFinite(y) || Math.abs(y) > Y_LIMIT) {
        if (cur.length > 1) segs.push(cur);
        cur = [];
        continue;
      }
      cur.push([x, y]);
    }
    if (cur.length > 1) segs.push(cur);
    return segs;
  }

  function polylinePoints(seg) {
    return seg.map(function (pt) {
      return sx(pt[0]).toFixed(1) + ',' + sy(pt[1]).toFixed(1);
    }).join(' ');
  }

  function gridHtml() {
    var parts = [];
    for (var v = -AXIS_MAX; v <= AXIS_MAX; v++) {
      if (v === 0) continue;
      parts.push('<line class="g-grid" x1="' + sx(v) + '" y1="0" x2="' + sx(v) + '" y2="' + VIEW + '"/>');
      parts.push('<line class="g-grid" x1="0" y1="' + sy(v) + '" x2="' + VIEW + '" y2="' + sy(v) + '"/>');
    }
    return parts.join('');
  }

  function axesHtml() {
    return '<line class="g-axis" x1="0" y1="' + sy(0) + '" x2="' + VIEW + '" y2="' + sy(0) + '"/>' +
      '<line class="g-axis" x1="' + sx(0) + '" y1="0" x2="' + sx(0) + '" y2="' + VIEW + '"/>' +
      '<circle class="g-origin" cx="' + sx(0) + '" cy="' + sy(0) + '" r="2"/>' +
      '<text class="g-tick" x="' + (sx(0) - 5) + '" y="' + (sy(0) + 13) + '" text-anchor="end">O</text>' +
      '<text class="g-tick" x="' + sx(1) + '" y="' + (sy(0) + 13) + '" text-anchor="middle">1</text>' +
      '<text class="g-tick" x="' + (sx(0) - 5) + '" y="' + (sy(1) + 4) + '" text-anchor="end">1</text>';
  }

  var clipSeq = 0;

  function graphSvgHtml(fn) {
    clipSeq++;
    var clipId = 'gclip' + clipSeq;
    var curves = buildSegments(fn).map(function (seg) {
      return '<polyline class="g-curve" points="' + polylinePoints(seg) + '"/>';
    }).join('');
    return '<svg class="graph-svg" viewBox="0 0 ' + VIEW + ' ' + VIEW + '" aria-hidden="true" focusable="false">' +
      '<defs><clipPath id="' + clipId + '">' +
      '<rect x="0" y="0" width="' + VIEW + '" height="' + VIEW + '"/></clipPath></defs>' +
      gridHtml() + axesHtml() +
      '<g clip-path="url(#' + clipId + ')">' + curves + '</g></svg>';
  }

  /* ===== graph 전용: 셔플 · 문항 준비 ===== */

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // toGraph는 정답 1개 + distractors를 섞고, 섞은 뒤의 정답 위치를 answerIndex로 다시 계산한다.
  function buildRunQuestions(cfg) {
    return cfg.questions.map(function (q) {
      if (q.mode !== 'toGraph') return q;
      var bundle = [{ fn: q.answer, correct: true }].concat(q.distractors.map(function (d) {
        return { fn: d, correct: false };
      }));
      bundle = shuffleArray(bundle);
      return {
        mode: 'toGraph',
        prompt: q.prompt,
        options: bundle.map(function (b) { return b.fn; }),
        answerIndex: bundle.findIndex(function (b) { return b.correct; }),
        explanation: q.explanation
      };
    });
  }

  /* ===== graph 전용: 상태 · 렌더링 ===== */

  var runtime = null;

  function initRuntime(cfg) {
    runtime = {
      cfg: cfg,
      questions: buildRunQuestions(cfg),
      idx: 0,
      score: 0,
      answered: false,
      selected: null,
      correct: null,
      reviews: []
    };
    renderQuestionScreen();
  }

  function progressBarHtml(idx, total) {
    var pct = Math.round((idx / total) * 100);
    return '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">' + (idx + 1) + ' / ' + total + '</div></div>';
  }

  function graphOptionsHtml(q) {
    return '<div class="graph-grid">' + q.options.map(function (fn, i) {
      var cls = 'graph-card';
      var mark = String(i + 1);
      if (runtime.answered) {
        if (i === q.answerIndex) { cls += ' correct'; mark = '○'; }
        else if (i === runtime.selected) { cls += ' wrong'; mark = '×'; }
        else { cls += ' disabled'; }
      }
      return '<button type="button" class="' + cls + '" data-i="' + i + '" aria-label="' + (i + 1) + '번 그래프"' +
        (runtime.answered ? ' disabled' : '') + '>' +
        '<span class="graph-mark">' + mark + '</span>' + graphSvgHtml(fn) + '</button>';
    }).join('') + '</div>';
  }

  function equationChoicesHtml(q) {
    return '<div class="graph-big">' + graphSvgHtml(q.graph) + '</div>' +
      '<div class="choices">' + q.choices.map(function (c, i) {
        var cls = 'choice-btn';
        var icon = '';
        if (runtime.answered) {
          if (i === q.answerIndex) { cls += ' correct'; icon = '<span class="ans-icon">○</span>'; }
          else if (i === runtime.selected) { cls += ' wrong'; icon = '<span class="ans-icon">×</span>'; }
          else { cls += ' disabled'; }
        }
        return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (runtime.answered ? ' disabled' : '') + '>' +
          icon + '<span class="choice-text">' + renderText(c) + '</span></button>';
      }).join('') + '</div>';
  }

  function answerAreaHtml(q) {
    return q.mode === 'toGraph' ? graphOptionsHtml(q) : equationChoicesHtml(q);
  }

  function feedbackHtml(q) {
    var icon = runtime.correct ? '○' : '×';
    var cls = runtime.correct ? 'feedback correct' : 'feedback wrong';
    var body;
    if (runtime.correct) {
      body = '<p class="fb-head">정답이에요!</p>';
    } else {
      var extra = [];
      if (q.mode === 'toGraph') {
        extra.push('정답은 ○ 표시가 있는 그래프예요.');
      } else {
        extra.push('정답: ' + renderText(q.choices[q.answerIndex]));
      }
      if (q.explanation) extra.push(renderText(q.explanation));
      body = '<p class="fb-head">아쉬워요.</p>' + extra.map(function (t) {
        return '<p class="fb-detail">' + t + '</p>';
      }).join('');
    }
    return '<div class="' + cls + '"><span class="fb-icon">' + icon + '</span><div class="fb-body">' + body + '</div></div>';
  }

  function renderQuestionScreen() {
    var cfg = runtime.cfg;
    var q = runtime.questions[runtime.idx];
    var total = runtime.questions.length;
    var html = '';
    html += headerHtml(cfg);
    html += progressBarHtml(runtime.idx, total);
    html += '<div class="card"><p class="prompt">' + renderText(q.prompt) + '</p>' +
      '<div class="answer-area">' + answerAreaHtml(q) + '</div>' +
      (runtime.answered ? feedbackHtml(q) : '') + '</div>';
    if (runtime.answered) {
      var isLast = runtime.idx === total - 1;
      html += '<button type="button" class="btn-primary" id="nextBtn">' + (isLast ? '결과 보기' : '다음 문제') + '</button>';
    }
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    wireAnswerEvents(q);
    if (runtime.answered) {
      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    }
  }

  function renderResultScreen() {
    var cfg = runtime.cfg;
    var total = runtime.questions.length;
    var html = '';
    html += headerHtml(cfg);
    html += '<div class="card result-card"><div class="result-score">' + runtime.score + ' / ' + total + '</div>' +
      '<div class="result-sub">' + (runtime.reviews.length === 0 ? '모든 문제를 맞혔어요!' : '틀린 문제를 다시 확인해 보세요.') + '</div></div>';
    if (runtime.reviews.length > 0) {
      html += '<div class="review-list">' + runtime.reviews.map(function (r, i) {
        return '<div class="review-item"><div class="review-num">' + (i + 1) + '</div>' +
          '<div class="review-body"><p class="review-prompt">' + renderText(r.prompt) + '</p>' +
          (r.explanation ? '<p class="review-explain">' + renderText(r.explanation) + '</p>' : '') +
          '</div></div>';
      }).join('') + '</div>';
    }
    html += '<button type="button" class="btn-primary btn-retry" id="retryBtn">다시 도전</button>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    document.getElementById('retryBtn').addEventListener('click', function () { initRuntime(cfg); });
  }

  function nextQuestion() {
    runtime.idx++;
    runtime.answered = false;
    runtime.selected = null;
    runtime.correct = null;
    if (runtime.idx >= runtime.questions.length) {
      renderResultScreen();
    } else {
      renderQuestionScreen();
    }
  }

  function grade(selected, correct, explanation, prompt) {
    runtime.selected = selected;
    runtime.answered = true;
    runtime.correct = correct;
    if (correct) {
      runtime.score++;
    } else {
      runtime.reviews.push({ prompt: prompt, explanation: explanation || '' });
    }
    renderQuestionScreen();
  }

  function wireAnswerEvents(q) {
    if (runtime.answered) return;
    var sel = q.mode === 'toGraph' ? '.graph-card' : '.choice-btn';
    document.querySelectorAll(sel).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.getAttribute('data-i'));
        grade(i, i === q.answerIndex, q.explanation, q.prompt);
      });
    });
  }

  /* ===== 부트스트랩 ===== */

  var cfg = getConfig();
  if (cfg && validateCommon(cfg) && validateGraph(cfg)) {
    applyTheme(cfg);
    document.title = cfg.title;
    initRuntime(cfg);
  }
})();
</script>
</body>
</html>
