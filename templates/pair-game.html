<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  pair-game.html — 짝맞추기 쉘 (schemaVersion 1, template "pair")
  quiz.html(4개 콘텐츠 쉘 공통 계약의 원본)의 CSS/JS 공통 블록을 그대로 복제한 쉘이다.

  사용법: 이 파일을 복사한 뒤 아래 id="config" 스크립트 블록(JSON) 내용만 교체한다.
  엔진(CSS/JS)은 건드리지 않는다.

  CONFIG 스키마:
  {
    "schemaVersion": 1,              // 고정값, 반드시 1
    "template": "pair",              // 고정값, 반드시 "pair"
    "title": "문자열",                 // 필수, 화면 상단 제목
    "subtitle": "문자열",              // 선택, 제목 아래 부제
    "theme": "indigo|pink|green|violet|teal|amber",  // 필수, 6종 중 하나
    "credit": {                      // 필수
      "mode": "anonymous|named",     // anonymous: 무기명 / named: 이름·학교 표기
      "name": "문자열",                // mode가 named일 때만 사용
      "school": "문자열"               // mode가 named일 때만 사용
    },
    "pairs": [                       // 필수, 3짝 이상
      ["왼쪽 문자열", "오른쪽 문자열"],   // 각 원소는 정확히 2개의 비어있지 않은 문자열
      // ...
    ]                                 // 왼쪽 값 전체가 서로 달라야 하고, 오른쪽 값 전체도 서로 달라야 함
                                       // (중복 시 CONFIG 오류 화면)
  }

  이스케이프 규칙: 위 script#config 블록은 <script> 태그이므로, 브라우저 HTML 파서는
  이 블록 안에서도 "</script" 로 시작하는 문자열을 만나면 태그를 즉시 조기 종료시킨다.
  따라서 CONFIG의 어떤 문자열 값에 "</" 시퀀스가 들어가면 반드시 "<\/" 로 이스케이프해서
  적는다. 예: prompt에 "a</b>" 를 쓰고 싶다면 "a<\/b>" 로 적을 것.
  (아래 예시의 <sup>2</sup> 처럼 "sup"·"sub" 태그는 "script"로 시작하지 않아 안전하지만,
  안전을 위해 CONFIG를 새로 작성할 때는 "</" 가 보이면 습관적으로 "<\/" 로 바꿔 적는다.)

  렌더링 규칙: 모든 CONFIG 문자열은 renderText()로 escape 후 &lt;sup&gt;/&lt;sub&gt;
  태그만 화이트리스트로 되돌려 <sup>/<sub>(제곱·아래첨자 표기)만 허용한다.

  게임 규칙: pairs 배열의 각 짝을 카드 2장(왼쪽 값 카드 1장 + 오른쪽 값 카드 1장)으로
  만들어 내용이 처음부터 모두 보이는 상태로 무작위로 섞어 배치한다(카드 총 12장 이하면
  3열, 13장 이상이면 4열). 학습자는 카드를 눈으로 훑어 짝이 되는 두 장을 탭한다.
  첫 탭은 선택(테두리·배경으로 표시)이고, 같은 카드를 다시 탭하면 선택이 취소된다.
  두 장을 선택하면 판정한다: 같은 짝이면 열린 채로 고정하고 ✓ 아이콘 + 초록색으로
  표시한다. 짝이 아니면 ✕ 아이콘 + 빨간색을 1초간 보여준 뒤 선택만 해제하고 카드 내용은
  계속 보인 채로 다시 선택할 수 있게 한다. 상단에는 찾은 짝 수/전체 짝 수와 시도 횟수를
  표시한다. 모든 짝을 다 찾으면 완료 화면([다시 도전] 버튼 — 누르면 카드를 다시 섞어
  처음부터 시작)을 보여준다.
-->
<title>짝맞추기</title>
<style>
  /* ===== 공통 계약: 기본 리셋 · 폰트 · 레이아웃 (모든 쉘 동일) ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f8fafc;
    color: #1f2937;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ===== 공통 계약: 테마 프리셋 CSS 변수 6종 (모든 쉘 동일) ===== */
  body.theme-indigo { --primary:#4f46e5; --primary-light:#eef2ff; --primary-dark:#4338ca; }
  body.theme-pink   { --primary:#db2777; --primary-light:#fdf2f8; --primary-dark:#be185d; }
  body.theme-green  { --primary:#16a34a; --primary-light:#f0fdf4; --primary-dark:#15803d; }
  body.theme-violet { --primary:#7c3aed; --primary-light:#f5f3ff; --primary-dark:#6d28d9; }
  body.theme-teal   { --primary:#0d9488; --primary-light:#f0fdfa; --primary-dark:#0f766e; }
  body.theme-amber  { --primary:#d97706; --primary-light:#fffbeb; --primary-dark:#b45309; }

  /* ===== 공통 계약: 에러 카드 (showError가 사용, 모든 쉘 동일) ===== */
  .error-card {
    max-width: 480px;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .error-icon { font-size: 32px; margin-bottom: 12px; }
  .error-msg { color: #374151; font-size: 15px; white-space: pre-wrap; word-break: break-word; margin: 0; }

  /* ===== 공통 계약: credit 푸터 (모든 쉘 동일) ===== */
  .credit { text-align: center; font-size: 12px; color: #6b7280; margin-top: 24px; }

  /* ===== 공통 JS(headerHtml)가 사용하는 헤더 스타일 (quiz.html과 동일) ===== */
  .app-header { text-align: center; margin-bottom: 16px; }
  .app-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; word-break: keep-all; }
  .app-subtitle { font-size: 14px; color: #6b7280; margin: 0; word-break: keep-all; }

  /* ===== pair 전용 스타일 ===== */
  .progress-wrap { margin-bottom: 16px; }
  .progress-bar { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--primary); height: 100%; transition: width .25s ease; }
  .progress-label { text-align: right; font-size: 12px; color: #6b7280; margin-top: 4px; }

  .pair-grid { display: grid; gap: 10px; margin-bottom: 16px; }
  .pair-card {
    min-height: 64px; min-width: 44px; padding: 10px 6px;
    border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; color: #1f2937;
    font-size: 14px; font-weight: 600; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; font-family: inherit;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .pair-card.selected { border-color: var(--primary); background: var(--primary-light); }
  .pair-card.matched { border-color: #16a34a; background: #f0fdf4; color: #16a34a; cursor: default; }
  .pair-card.wrong { border-color: #dc2626; background: #fef2f2; color: #dc2626; cursor: default; }
  .pair-card:disabled { cursor: default; }
  .pair-icon { font-weight: 700; flex: none; }
  .pair-text { flex: 1; min-width: 0; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    margin-bottom: 16px;
  }
  .result-card { text-align: center; }
  .result-score { font-size: 36px; font-weight: 800; color: var(--primary); }
  .result-sub { color: #6b7280; margin-top: 6px; word-break: keep-all; }

  .btn-primary {
    display: block; width: 100%; min-height: 48px;
    background: var(--primary); color: #ffffff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    padding: 12px 16px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-retry { margin-bottom: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="config">
{
  "schemaVersion": 1,
  "template": "pair",
  "title": "인수분해 짝맞추기",
  "theme": "violet",
  "credit": { "mode": "anonymous", "name": "", "school": "" },
  "pairs": [
    ["x<sup>2<\/sup>-4", "(x-2)(x+2)"],
    ["x<sup>2<\/sup>+2x+1", "(x+1)<sup>2<\/sup>"],
    ["x<sup>2<\/sup>-6x+9", "(x-3)<sup>2<\/sup>"],
    ["x<sup>2<\/sup>+5x+6", "(x+2)(x+3)"],
    ["2x<sup>2<\/sup>+4x", "2x(x+2)"],
    ["x<sup>2<\/sup>-x-6", "(x-3)(x+2)"]
  ]
}
</script>

<script>
(function () {
  "use strict";

  /* ===== 공통 계약 (모든 쉘 동일) — quiz.html에서 그대로 복제 ===== */

  function getConfig() {
    var parsed;
    try {
      parsed = JSON.parse(document.getElementById('config').textContent);
    } catch (e) {
      showError('CONFIG 오류: JSON 문법 — ' + e.message);
      return null;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      showError('CONFIG 오류: CONFIG는 JSON 객체({ ... })여야 합니다. 현재 값의 타입을 확인해 주세요.');
      return null;
    }
    return parsed;
  }

  function showError(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="error-card"><div class="error-icon">⚠️</div><p class="error-msg"></p></div>';
    app.querySelector('.error-msg').textContent = msg;
  }

  function validateCommon(cfg) {
    if (cfg.schemaVersion !== 1) {
      showError('CONFIG 오류: schemaVersion이 1이 아닙니다.');
      return false;
    }
    if (cfg.template !== 'pair') {
      showError('CONFIG 오류: template이 "pair"가 아닙니다.');
      return false;
    }
    if (typeof cfg.title !== 'string' || cfg.title.length === 0) {
      showError('CONFIG 오류: title이 없거나 빈 문자열입니다.');
      return false;
    }
    if (['indigo', 'pink', 'green', 'violet', 'teal', 'amber'].indexOf(cfg.theme) === -1) {
      showError('CONFIG 오류: theme 값이 올바르지 않습니다. (indigo/pink/green/violet/teal/amber 중 하나)');
      return false;
    }
    if (!cfg.credit || ['anonymous', 'named'].indexOf(cfg.credit.mode) === -1) {
      showError('CONFIG 오류: credit.mode 값이 올바르지 않습니다. (anonymous/named 중 하나)');
      return false;
    }
    return true;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(s) {
    return escapeHtml(s)
      .replace(/&lt;sup&gt;/g, '<sup>')
      .replace(/&lt;\/sup&gt;/g, '</sup>')
      .replace(/&lt;sub&gt;/g, '<sub>')
      .replace(/&lt;\/sub&gt;/g, '</sub>');
  }

  function applyTheme(cfg) {
    document.body.classList.add('theme-' + cfg.theme);
  }

  function creditFooterHtml(cfg) {
    var c = cfg.credit;
    var text;
    if (c.mode === 'anonymous') {
      text = '2026 과학·수학·정보 교사 컨퍼런스에서 제작';
    } else {
      text = renderText(c.name || '') + ' 선생님 (' + renderText(c.school || '') + ') · 2026 과학·수학·정보 교사 컨퍼런스';
    }
    return '<footer class="credit">' + text + '</footer>';
  }

  function headerHtml(cfg) {
    var sub = cfg.subtitle ? '<p class="app-subtitle">' + renderText(cfg.subtitle) + '</p>' : '';
    return '<header class="app-header"><h1 class="app-title">' + renderText(cfg.title) + '</h1>' + sub + '</header>';
  }

  /* ===== 공통 계약 끝 ===== */

  /* ===== pair 전용: 검증 ===== */

  function hasDuplicates(arr) {
    for (var i = 0; i < arr.length; i++) {
      for (var j = i + 1; j < arr.length; j++) {
        if (arr[i] === arr[j]) return true;
      }
    }
    return false;
  }

  function validatePair(cfg) {
    if (!Array.isArray(cfg.pairs) || cfg.pairs.length < 3) {
      showError('CONFIG 오류: pairs 배열이 없거나 3짝 미만입니다.');
      return false;
    }
    var lefts = [];
    var rights = [];
    for (var i = 0; i < cfg.pairs.length; i++) {
      var p = cfg.pairs[i];
      var n = i + 1;
      if (!Array.isArray(p) || p.length !== 2 ||
        typeof p[0] !== 'string' || p[0].length === 0 ||
        typeof p[1] !== 'string' || p[1].length === 0) {
        showError('CONFIG 오류: ' + n + '번째 짝의 형식이 올바르지 않습니다. (비어있지 않은 문자열 2개로 이뤄진 배열이어야 함)');
        return false;
      }
      lefts.push(p[0]);
      rights.push(p[1]);
    }
    if (hasDuplicates(lefts)) {
      showError('CONFIG 오류: pairs의 왼쪽 값이 중복됩니다.');
      return false;
    }
    if (hasDuplicates(rights)) {
      showError('CONFIG 오류: pairs의 오른쪽 값이 중복됩니다.');
      return false;
    }
    return true;
  }

  /* ===== pair 전용: 카드 셔플 · 상태 · 렌더링 ===== */

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildCards(cfg) {
    var cards = [];
    cfg.pairs.forEach(function (p, i) {
      cards.push({ pairIndex: i, text: p[0], matched: false });
      cards.push({ pairIndex: i, text: p[1], matched: false });
    });
    return shuffleArray(cards);
  }

  var runtime = null;

  function initRuntime(cfg) {
    runtime = {
      cfg: cfg,
      cards: buildCards(cfg),
      flipped: [],
      wrongPair: null,
      locked: false,
      attempts: 0,
      foundCount: 0
    };
    renderGameScreen();
  }

  function statsHtml() {
    var total = runtime.cards.length / 2;
    var pct = Math.round((runtime.foundCount / total) * 100);
    return '<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">찾은 짝 ' + runtime.foundCount + ' / ' + total + ' · 시도 ' + runtime.attempts + '회</div></div>';
  }

  function cardHtml(card, i) {
    var isSelected = runtime.flipped.indexOf(i) !== -1;
    var isWrong = runtime.wrongPair !== null && runtime.wrongPair.indexOf(i) !== -1;
    var cls = 'pair-card';
    var icon = '';
    if (card.matched) {
      cls += ' matched';
      icon = '<span class="pair-icon">✓</span>';
    } else if (isWrong) {
      cls += ' wrong';
      icon = '<span class="pair-icon">✕</span>';
    } else if (isSelected) {
      cls += ' selected';
    }
    var disabled = card.matched || runtime.locked;
    var text = '<span class="pair-text">' + renderText(card.text) + '</span>';
    return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (disabled ? ' disabled' : '') + '>' + icon + text + '</button>';
  }

  function renderGameScreen() {
    var cfg = runtime.cfg;
    var cols = runtime.cards.length > 12 ? 4 : 3;
    var html = '';
    html += headerHtml(cfg);
    html += statsHtml();
    html += '<div class="pair-grid" style="grid-template-columns: repeat(' + cols + ', 1fr);">' +
      runtime.cards.map(function (card, i) { return cardHtml(card, i); }).join('') +
      '</div>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    wireCardEvents();
  }

  function renderCompleteScreen() {
    var cfg = runtime.cfg;
    var total = runtime.cards.length / 2;
    var html = '';
    html += headerHtml(cfg);
    html += '<div class="card result-card"><div class="result-score">' + total + ' / ' + total + '</div>' +
      '<div class="result-sub">모든 짝을 찾았어요! 총 시도 ' + runtime.attempts + '회</div></div>';
    html += '<button type="button" class="btn-primary btn-retry" id="retryBtn">다시 도전</button>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    document.getElementById('retryBtn').addEventListener('click', function () { initRuntime(cfg); });
  }

  function handleCardClick(i) {
    if (runtime.locked) return;
    var card = runtime.cards[i];
    if (card.matched) return;

    var idx = runtime.flipped.indexOf(i);
    if (idx !== -1) {
      runtime.flipped.splice(idx, 1);
      renderGameScreen();
      return;
    }

    runtime.flipped.push(i);

    if (runtime.flipped.length < 2) {
      renderGameScreen();
      return;
    }

    runtime.attempts++;
    var a = runtime.cards[runtime.flipped[0]];
    var b = runtime.cards[runtime.flipped[1]];

    if (a.pairIndex === b.pairIndex) {
      a.matched = true;
      b.matched = true;
      runtime.foundCount++;
      runtime.flipped = [];
      if (runtime.foundCount === runtime.cards.length / 2) {
        renderCompleteScreen();
      } else {
        renderGameScreen();
      }
      return;
    }

    runtime.locked = true;
    runtime.wrongPair = runtime.flipped.slice();
    runtime.flipped = [];
    renderGameScreen();
    setTimeout(function () {
      runtime.wrongPair = null;
      runtime.locked = false;
      renderGameScreen();
    }, 1000);
  }

  function wireCardEvents() {
    var btns = document.querySelectorAll('.pair-card');
    btns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.getAttribute('data-i'));
        handleCardClick(i);
      });
    });
  }

  /* ===== 부트스트랩 ===== */

  var cfg = getConfig();
  if (cfg && validateCommon(cfg) && validatePair(cfg)) {
    applyTheme(cfg);
    document.title = cfg.title;
    initRuntime(cfg);
  }
})();
</script>
</body>
</html>
