<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  order-game.html — 순서 배열 쉘 (schemaVersion 1, template "order")
  이 파일은 quiz.html(공통 계약의 원본)의 공통 블록을 그대로 복제한 4개 콘텐츠 쉘 중 하나다.
  아래 "공통 계약" 표시가 붙은 JS/CSS 블록은 quiz.html과 동일하다(template 판정 문자열만 예외).

  사용법: 이 파일을 복사한 뒤 아래 id="config" 스크립트 블록(JSON) 내용만 교체한다.
  엔진(CSS/JS)은 건드리지 않는다.

  CONFIG 스키마:
  {
    "schemaVersion": 1,              // 고정값, 반드시 1
    "template": "order",             // 고정값, 반드시 "order"
    "title": "문자열",                 // 필수, 화면 상단 제목
    "subtitle": "문자열",              // 선택, 제목 아래 부제
    "theme": "indigo|pink|green|violet|teal|amber",  // 필수, 6종 중 하나
    "credit": {                      // 필수
      "mode": "anonymous|named",     // anonymous: 무기명 / named: 이름·학교 표기
      "name": "문자열",                // mode가 named일 때만 사용
      "school": "문자열"               // mode가 named일 때만 사용
    },
    "prompt": "문자열",                // 필수, 배열 지시문
    "items": ["문자열", "..."]         // 필수, 정답 순서(앞→뒤). 3개 이상, 빈 문자열/중복 금지
  }

  이스케이프 규칙: 위 script#config 블록은 <script> 태그이므로, 브라우저 HTML 파서는
  이 블록 안에서도 "</script" 로 시작하는 문자열을 만나면 태그를 즉시 조기 종료시킨다.
  따라서 CONFIG의 어떤 문자열 값에 "</" 시퀀스가 들어가면 반드시 "<\/" 로 이스케이프해서
  적는다. 예: prompt에 "a</b>" 를 쓰고 싶다면 "a<\/b>" 로 적을 것.

  렌더링 규칙: 모든 CONFIG 문자열은 renderText()로 escape 후 &lt;sup&gt;/&lt;sub&gt;
  태그만 화이트리스트로 되돌려 <sup>/<sub>(제곱·아래첨자 표기)만 허용한다.

  용도: 부등호로 수 크기 비교, 그래프의 폭·기울기 비교 등 순서를 판단하는 다양한
  활동에 쓴다.

  조작 방식: 화면 위쪽에 정답 순서를 채울 빈 칸(슬롯) N개가 번호(1~N)와 함께 나열되고,
  그 아래 <보기> 영역에 셔플된 항목 카드가 놓인다. 보기 카드를 누르면 가장 앞의 빈
  칸에 들어가고, 채워진 칸을 다시 누르면 보기로 되돌아간다(취소). 드래그는 지원하지
  않는다. 모든 칸이 채워져야 [확인] 버튼이 활성화되며, 누르면 칸마다 정오(○/×)가
  표시된다. 전부 맞으면 완료 화면([다시 도전] = 완전 리셋·재셔플)으로 넘어가고,
  틀리면 그 자리에서 카드를 빼고 다시 놓아 재시도할 수 있다(재배치 시 표시는 초기화).
-->
<title>순서 배열</title>
<style>
  /* ===== 공통 계약: 기본 리셋 · 폰트 · 레이아웃 (모든 쉘 동일) ===== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f8fafc;
    color: #1f2937;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ===== 공통 계약: 테마 프리셋 CSS 변수 6종 (모든 쉘 동일) ===== */
  body.theme-indigo { --primary:#4f46e5; --primary-light:#eef2ff; --primary-dark:#4338ca; }
  body.theme-pink   { --primary:#db2777; --primary-light:#fdf2f8; --primary-dark:#be185d; }
  body.theme-green  { --primary:#16a34a; --primary-light:#f0fdf4; --primary-dark:#15803d; }
  body.theme-violet { --primary:#7c3aed; --primary-light:#f5f3ff; --primary-dark:#6d28d9; }
  body.theme-teal   { --primary:#0d9488; --primary-light:#f0fdfa; --primary-dark:#0f766e; }
  body.theme-amber  { --primary:#d97706; --primary-light:#fffbeb; --primary-dark:#b45309; }

  /* ===== 공통 계약: 에러 카드 (showError가 사용, 모든 쉘 동일) ===== */
  .error-card {
    max-width: 480px;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .error-icon { font-size: 32px; margin-bottom: 12px; }
  .error-msg { color: #374151; font-size: 15px; white-space: pre-wrap; word-break: break-word; margin: 0; }

  /* ===== 공통 계약: credit 푸터 (모든 쉘 동일) ===== */
  .credit { text-align: center; font-size: 12px; color: #6b7280; margin-top: 24px; }

  /* ===== order 전용 스타일 ===== */
  .app-header { text-align: center; margin-bottom: 16px; }
  .app-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; word-break: keep-all; }
  .app-subtitle { font-size: 14px; color: #6b7280; margin: 0; word-break: keep-all; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    margin-bottom: 16px;
  }
  .prompt { font-size: 17px; font-weight: 600; margin: 0 0 16px; word-break: keep-all; overflow-wrap: break-word; }
  .hint { font-size: 13px; color: #6b7280; margin: -8px 0 14px; }

  .slots {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-bottom: 14px;
  }
  .slot {
    min-height: 64px; padding: 8px 6px;
    border: 2px dashed #e5e7eb; border-radius: 12px;
    background: #f8fafc;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-align: center;
  }
  .slot-filled { border-style: solid; border-color: var(--primary); background: #ffffff; cursor: pointer; }
  .slot-filled:hover { background: var(--primary-light); }
  .slot.correct { border-color: #16a34a; background: #f0fdf4; }
  .slot.wrong { border-color: #dc2626; background: #fef2f2; }

  .slot-num {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: #e5e7eb; color: #374151; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .slot-filled .slot-num { background: var(--primary); color: #ffffff; }
  .slot.correct .slot-num { background: #16a34a; }
  .slot.wrong .slot-num { background: #dc2626; }
  .slot-text { font-size: 14px; word-break: keep-all; overflow-wrap: break-word; }
  .slot-icon { font-weight: 700; font-size: 16px; }
  .slot.correct .slot-icon { color: #16a34a; }
  .slot.wrong .slot-icon { color: #dc2626; }

  .bank-label {
    font-size: 13px; font-weight: 700; color: #374151;
    margin: 4px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #e5e7eb;
  }
  .bank {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-bottom: 4px;
  }
  .bank-card {
    min-height: 48px; padding: 10px 8px;
    border: 2px solid #e5e7eb; border-radius: 12px;
    background: #ffffff; font-size: 14px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center; text-align: center;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .bank-card:hover { border-color: var(--primary); color: var(--primary); }
  .bank-card:active { background: var(--primary-light); }

  .btn-primary {
    display: block; width: 100%; min-height: 48px;
    background: var(--primary); color: #ffffff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    padding: 12px 16px; margin-top: 16px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: .4; cursor: default; }
  .btn-primary:disabled:hover { background: var(--primary); }

  .result-card { text-align: center; }
  .result-icon { font-size: 40px; margin-bottom: 4px; }
  .result-sub { color: #6b7280; margin-top: 6px; font-weight: 600; }

  .final-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .final-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 2px solid #16a34a; background: #f0fdf4; border-radius: 12px;
  }
  .final-num {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: #16a34a; color: #ffffff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .final-text { flex: 1; min-width: 0; font-size: 15px; word-break: keep-all; overflow-wrap: break-word; }
  .final-icon { flex: none; color: #16a34a; font-weight: 700; font-size: 18px; }

  .btn-retry { margin-bottom: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="application/json" id="config">
{
  "schemaVersion": 1,
  "template": "order",
  "title": "작은 수부터 차례로!",
  "theme": "amber",
  "credit": { "mode": "anonymous", "name": "", "school": "" },
  "prompt": "작은 수부터 순서대로 배열하세요",
  "items": ["-2", "-1/2", "0", "0.7", "6/7", "1.2"]
}
</script>

<script>
(function () {
  "use strict";

  /* ===== 공통 계약 (모든 쉘 동일) — quiz.html에서 그대로 복제, template 판정 문자열만 예외 ===== */

  function getConfig() {
    var parsed;
    try {
      parsed = JSON.parse(document.getElementById('config').textContent);
    } catch (e) {
      showError('CONFIG 오류: JSON 문법 — ' + e.message);
      return null;
    }
    if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
      showError('CONFIG 오류: CONFIG는 JSON 객체({ ... })여야 합니다. 현재 값의 타입을 확인해 주세요.');
      return null;
    }
    return parsed;
  }

  function showError(msg) {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="error-card"><div class="error-icon">⚠️</div><p class="error-msg"></p></div>';
    app.querySelector('.error-msg').textContent = msg;
  }

  function validateCommon(cfg) {
    if (cfg.schemaVersion !== 1) {
      showError('CONFIG 오류: schemaVersion이 1이 아닙니다.');
      return false;
    }
    if (cfg.template !== 'order') {
      showError('CONFIG 오류: template이 "order"가 아닙니다.');
      return false;
    }
    if (typeof cfg.title !== 'string' || cfg.title.length === 0) {
      showError('CONFIG 오류: title이 없거나 빈 문자열입니다.');
      return false;
    }
    if (['indigo', 'pink', 'green', 'violet', 'teal', 'amber'].indexOf(cfg.theme) === -1) {
      showError('CONFIG 오류: theme 값이 올바르지 않습니다. (indigo/pink/green/violet/teal/amber 중 하나)');
      return false;
    }
    if (!cfg.credit || ['anonymous', 'named'].indexOf(cfg.credit.mode) === -1) {
      showError('CONFIG 오류: credit.mode 값이 올바르지 않습니다. (anonymous/named 중 하나)');
      return false;
    }
    return true;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(s) {
    return escapeHtml(s)
      .replace(/&lt;sup&gt;/g, '<sup>')
      .replace(/&lt;\/sup&gt;/g, '</sup>')
      .replace(/&lt;sub&gt;/g, '<sub>')
      .replace(/&lt;\/sub&gt;/g, '</sub>');
  }

  function applyTheme(cfg) {
    document.body.classList.add('theme-' + cfg.theme);
  }

  function creditFooterHtml(cfg) {
    var c = cfg.credit;
    var text;
    if (c.mode === 'anonymous') {
      text = '2026 과학·수학·정보 교사 컨퍼런스에서 제작';
    } else {
      text = renderText(c.name || '') + ' 선생님 (' + renderText(c.school || '') + ') · 2026 과학·수학·정보 교사 컨퍼런스';
    }
    return '<footer class="credit">' + text + '</footer>';
  }

  function headerHtml(cfg) {
    var sub = cfg.subtitle ? '<p class="app-subtitle">' + renderText(cfg.subtitle) + '</p>' : '';
    return '<header class="app-header"><h1 class="app-title">' + renderText(cfg.title) + '</h1>' + sub + '</header>';
  }

  /* ===== 공통 계약 끝 ===== */

  /* ===== order 전용: 검증 ===== */

  function validateOrder(cfg) {
    if (typeof cfg.prompt !== 'string' || cfg.prompt.length === 0) {
      showError('CONFIG 오류: prompt가 없거나 빈 문자열입니다.');
      return false;
    }
    if (!Array.isArray(cfg.items) || cfg.items.length < 3) {
      showError('CONFIG 오류: items 배열이 없거나 3개 미만입니다.');
      return false;
    }
    for (var i = 0; i < cfg.items.length; i++) {
      if (typeof cfg.items[i] !== 'string' || cfg.items[i].length === 0) {
        showError('CONFIG 오류: items[' + (i + 1) + ']이 빈 문자열이거나 문자열이 아닙니다.');
        return false;
      }
    }
    for (var j = 0; j < cfg.items.length; j++) {
      if (cfg.items.indexOf(cfg.items[j]) !== j) {
        showError('CONFIG 오류: items에 중복된 문자열이 있습니다. ("' + cfg.items[j] + '")');
        return false;
      }
    }
    return true;
  }

  /* ===== order 전용: 셔플 · 이동 헬퍼 ===== */

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function isIdentityOrder(arr) {
    return arr.every(function (v, i) { return v === i; });
  }

  // 정답과 같은 순서로 셔플되지 않도록 재시도(최대 50회, 항목 1개 이하면 그대로 사용).
  function shuffleIndices(n) {
    var idx = [];
    for (var i = 0; i < n; i++) idx.push(i);
    if (n <= 1) return idx;
    var shuffled = idx;
    var attempts = 0;
    do {
      shuffled = shuffleArray(idx);
      attempts++;
    } while (attempts < 50 && isIdentityOrder(shuffled));
    return shuffled;
  }

  /* ===== order 전용: 상태 · 렌더링 ===== */

  var runtime = null;

  function makeEmptySlots(n) {
    var s = [];
    for (var i = 0; i < n; i++) s.push(null);
    return s;
  }

  function initRuntime(cfg) {
    runtime = {
      cfg: cfg,
      items: cfg.items,
      itemOrder: shuffleIndices(cfg.items.length),
      slots: makeEmptySlots(cfg.items.length),
      checked: false,
      results: null
    };
    renderPlayScreen();
  }

  // 아직 어느 칸에도 놓이지 않은 항목의 인덱스를, 보기 영역에 보여줄 순서(itemOrder) 그대로 반환.
  function bankIndices() {
    return runtime.itemOrder.filter(function (i) { return runtime.slots.indexOf(i) === -1; });
  }

  function slotsHtml() {
    return '<div class="slots">' + runtime.slots.map(function (itemIdx, pos) {
      if (itemIdx === null) {
        return '<div class="slot"><span class="slot-num">' + (pos + 1) + '</span></div>';
      }
      var cls = 'slot slot-filled';
      var icon = '';
      if (runtime.checked) {
        if (runtime.results[pos]) { cls += ' correct'; icon = '<span class="slot-icon">○</span>'; }
        else { cls += ' wrong'; icon = '<span class="slot-icon">×</span>'; }
      }
      return '<div class="' + cls + '" data-slot="' + pos + '" role="button" tabindex="0">' +
        '<span class="slot-num">' + (pos + 1) + '</span>' +
        '<span class="slot-text">' + renderText(runtime.items[itemIdx]) + '</span>' + icon +
        '</div>';
    }).join('') + '</div>';
  }

  function bankHtml() {
    var indices = bankIndices();
    if (indices.length === 0) return '';
    return '<p class="bank-label">&lt;보기&gt;</p><div class="bank">' + indices.map(function (itemIdx) {
      return '<div class="bank-card" data-item="' + itemIdx + '" role="button" tabindex="0">' +
        renderText(runtime.items[itemIdx]) +
        '</div>';
    }).join('') + '</div>';
  }

  function renderPlayScreen() {
    var cfg = runtime.cfg;
    var allFilled = runtime.slots.indexOf(null) === -1;
    var html = '';
    html += headerHtml(cfg);
    html += '<div class="card"><p class="prompt">' + renderText(cfg.prompt) + '</p>' +
      '<p class="hint">빈 칸에 순서대로 &lt;보기&gt;의 카드를 눌러 채우세요. 채운 카드를 다시 누르면 취소돼요.</p>' +
      slotsHtml() +
      bankHtml() +
      '<button type="button" class="btn-primary" id="checkBtn"' + (allFilled ? '' : ' disabled') + '>확인</button></div>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    wirePlayEvents();
  }

  function renderCompleteScreen() {
    var cfg = runtime.cfg;
    var html = '';
    html += headerHtml(cfg);
    html += '<div class="card result-card"><div class="result-icon">🎉</div>' +
      '<div class="result-sub">정답이에요! 순서를 모두 맞혔어요.</div></div>';
    html += '<div class="final-list">' + runtime.items.map(function (text, i) {
      return '<div class="final-row"><span class="final-num">' + (i + 1) + '</span>' +
        '<span class="final-text">' + renderText(text) + '</span>' +
        '<span class="final-icon">○</span></div>';
    }).join('') + '</div>';
    html += '<button type="button" class="btn-primary btn-retry" id="retryBtn">다시 도전</button>';
    html += creditFooterHtml(cfg);
    document.getElementById('app').innerHTML = html;
    document.getElementById('retryBtn').addEventListener('click', function () { initRuntime(cfg); });
  }

  // 보기 카드를 탭했을 때: 가장 앞의 빈 칸(인덱스가 가장 작은 null)에 채운다.
  function placeItem(itemIdx) {
    var slotPos = runtime.slots.indexOf(null);
    if (slotPos === -1) return;
    runtime.slots[slotPos] = itemIdx;
    runtime.checked = false;
    runtime.results = null;
    renderPlayScreen();
  }

  // 채워진 칸을 탭했을 때: 그 항목을 비우고 보기로 되돌린다.
  function removeItem(pos) {
    if (runtime.slots[pos] === null) return;
    runtime.slots[pos] = null;
    runtime.checked = false;
    runtime.results = null;
    renderPlayScreen();
  }

  function checkOrder() {
    if (runtime.slots.indexOf(null) !== -1) return;
    var results = runtime.slots.map(function (itemIdx, pos) { return itemIdx === pos; });
    runtime.checked = true;
    runtime.results = results;
    if (results.every(function (r) { return r; })) {
      renderCompleteScreen();
    } else {
      renderPlayScreen();
    }
  }

  function wirePlayEvents() {
    var bankCards = document.querySelectorAll('.bank-card');
    bankCards.forEach(function (card) {
      card.addEventListener('click', function () {
        placeItem(Number(card.getAttribute('data-item')));
      });
    });
    var filledSlots = document.querySelectorAll('.slot-filled');
    filledSlots.forEach(function (slot) {
      slot.addEventListener('click', function () {
        removeItem(Number(slot.getAttribute('data-slot')));
      });
    });
    var checkBtn = document.getElementById('checkBtn');
    if (checkBtn) checkBtn.addEventListener('click', checkOrder);
  }

  /* ===== 부트스트랩 ===== */

  var cfg = getConfig();
  if (cfg && validateCommon(cfg) && validateOrder(cfg)) {
    applyTheme(cfg);
    document.title = cfg.title;
    initRuntime(cfg);
  }
})();
</script>
</body>
</html>
